<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Portmap</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Crect x='2' y='6' width='20' height='12' fill='%23fcee0a'/%3E%3Crect x='5' y='10' width='3' height='4' fill='%2307080c'/%3E%3Crect x='10.5' y='10' width='3' height='4' fill='%2307080c'/%3E%3Crect x='16' y='10' width='3' height='4' fill='%2307080c'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="css/theme.css">
  <link rel="stylesheet" href="css/app.css">
  <script type="module" src="js/main.js"></script>
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <span class="brand-mark">PORTMAP</span>
      <span class="brand-site" id="site">—</span>
    </div>
    <nav class="tabs" id="tabs" aria-label="Views"></nav>
    <div class="top-tools">
      <label class="search">
        <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true"><path d="M11 18a7 7 0 1 1 0-14 7 7 0 0 1 0 14z M16 16l4 4"/></svg>
        <input id="search" type="search" placeholder="Search name, IP, MAC, patch, desk…" aria-label="Search" autocomplete="off" spellcheck="false">
        <kbd>/</kbd>
      </label>
      <button class="icon-btn" id="import" type="button" title="Import JSON">
        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true"><path d="M12 20V9 M7 14l5-5 5 5 M5 4h14"/></svg>
      </button>
      <button class="icon-btn" id="export" type="button" title="Export JSON">
        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true"><path d="M12 4v11 M7 10l5 5 5-5 M5 20h14"/></svg>
      </button>
      <input id="import-file" type="file" accept="application/json,.json" hidden>
      <span class="status" id="status" role="status" data-status="saved">—</span>
    </div>
  </header>
  <div class="banner" id="banner" hidden></div>
  <main id="view" class="view"></main>
  <aside id="drawer" class="drawer" aria-hidden="true" aria-label="Editor"></aside>
  <dialog id="dialog" class="dialog"></dialog>
  <dialog id="confirm" class="dialog"></dialog>
  <div id="toasts" class="toasts" aria-live="polite"></div>
</body>
</html>
