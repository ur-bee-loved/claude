name: portmap

on:
  push:
    branches: [main]
    paths: ["portmap/**", ".github/workflows/portmap.yml"]
  pull_request:
    paths: ["portmap/**", ".github/workflows/portmap.yml"]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: portmap

jobs:
  test:
    name: Tests (Python ${{ matrix.python }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      matrix:
        python: ["3.10", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install the test tools
        run: python -m pip install pytest openpyxl "ruff==0.16.10"
      - name: Lint
        run: python -m ruff check --isolated server.py import_xlsx.py tests
      - name: Python tests
        run: python -m pytest -q tests
      - name: JavaScript tests
        run: node --test web/tests/*.test.mjs
