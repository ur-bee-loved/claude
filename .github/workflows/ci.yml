name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  linux:
    name: Linux (Ubuntu)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install system backends
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ffmpeg imagemagick ghostscript poppler-utils pandoc qpdf img2pdf librsvg2-bin libegl1 libxkbcommon0 libgl1
      - name: Install Python backends
        run: python -m pip install -e ".[all,qt]" pytest
      - name: Backend report
        run: python -m omniconv doctor
      - name: Tests
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -m pytest -q
      - name: Render the window
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          python scripts/gui-screenshot.py screenshots/light
          python scripts/gui-screenshot.py screenshots/dark --dark
      - name: Upload screenshots
        uses: actions/upload-artifact@v4
        with:
          name: screenshots-linux
          path: screenshots/
          if-no-files-found: error

  linux-gtk:
    name: Linux (GTK 4 front end)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Install GTK 4, libadwaita and a few backends
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends python3-gi python3-gi-cairo gir1.2-gtk-4.0 gir1.2-adw-1 xvfb ffmpeg imagemagick ghostscript poppler-utils
      - name: Environment that can see the system typelibs
        # PyGObject's typelibs come from apt, not pip, so the venv has to
        # inherit the system packages.
        run: |
          python3 -m venv --system-site-packages .venv-gtk
          .venv-gtk/bin/pip install --upgrade pip
          .venv-gtk/bin/pip install -e ".[all]" pytest
      - name: Prove PyGObject works, so the tests cannot skip unnoticed
        run: |
          .venv-gtk/bin/python -c "import gi; gi.require_version('Gtk','4.0'); gi.require_version('Adw','1'); from gi.repository import Adw, Gtk; print('PyGObject', gi.__version__, 'ok')"
      - name: GTK tests under a virtual display
        run: xvfb-run -a .venv-gtk/bin/python -m pytest tests/test_gtk_gui.py -q -rs
      - name: GUI self-test builds the GTK window
        env:
          OMNICONV_TOOLKIT: gtk
        run: |
          xvfb-run -a .venv-gtk/bin/python -m omniconv gui --self-test | tee self-test.txt
          grep -q "^window: 'Omniconv'" self-test.txt || { echo "the self-test did not build a window"; exit 1; }

  windows:
    name: Windows
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install system backends (Chocolatey)
        shell: pwsh
        # A stalled download once held this step for 47 minutes; fail fast instead.
        timeout-minutes: 12
        run: |
          choco install ffmpeg imagemagick ghostscript poppler pandoc qpdf 7zip graphviz -y --no-progress
      - name: Install Python backends
        run: python -m pip install -e ".[all,qt]" pytest pyinstaller
      - name: Backend report
        shell: pwsh
        run: |
          # Chocolatey adds to PATH for new shells; refresh it here.
          Import-Module "$env:ChocolateyInstall\helpers\chocolateyProfile.psm1"
          refreshenv
          python -m omniconv doctor
      - name: Tests
        shell: pwsh
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          Import-Module "$env:ChocolateyInstall\helpers\chocolateyProfile.psm1"
          refreshenv
          python -m pytest -q
      - name: Render the window
        shell: pwsh
        env:
          QT_QPA_PLATFORM: offscreen
        # Offscreen Qt still rasterises, so this is the only way the Windows
        # window is ever looked at: the images go up as an artifact.
        run: |
          Import-Module "$env:ChocolateyInstall\helpers\chocolateyProfile.psm1"
          refreshenv
          python scripts\gui-screenshot.py screenshots\light
          python scripts\gui-screenshot.py screenshots\dark --dark
      - name: Upload screenshots
        uses: actions/upload-artifact@v4
        with:
          name: screenshots-windows
          path: screenshots/
          if-no-files-found: error
      - name: Dry-run the dependency installer
        shell: pwsh
        run: powershell -ExecutionPolicy Bypass -File scripts\install-deps.ps1 -DryRun
      - name: Install scoop so its package names can be checked too
        shell: pwsh
        continue-on-error: true
        run: |
          Invoke-Expression "& {$(Invoke-RestMethod get.scoop.sh)} -RunAsAdmin"
          $env:PATH = "$env:USERPROFILE\scoop\shims;$env:PATH"
          scoop bucket add extras
          scoop --version
          "$env:USERPROFILE\scoop\shims" | Out-File -Append -Encoding utf8 $env:GITHUB_PATH
      - name: Check package identifiers against winget, scoop and Chocolatey
        shell: pwsh
        # Informational: catalogues change, so an unknown identifier is reported, not fatal.
        continue-on-error: true
        run: powershell -ExecutionPolicy Bypass -File scripts\install-deps.ps1 -CheckIds
      - name: Build stand-alone executables
        shell: pwsh
        run: |
          pyinstaller --noconfirm --clean packaging\windows\omniconv.spec
          if (-not (Test-Path dist\Omniconv\omniconvw.exe)) { throw "GUI executable missing" }
          if (-not (Test-Path dist\Omniconv\omniconv.exe)) { throw "CLI executable missing" }
          # Windows filenames are case-insensitive: names differing only in case
          # would be one file, so prove these two are really distinct builds.
          $gui = (Get-FileHash dist\Omniconv\omniconvw.exe).Hash
          $cli = (Get-FileHash dist\Omniconv\omniconv.exe).Hash
          if ($gui -eq $cli) { throw "omniconvw.exe and omniconv.exe are the same file" }
          dist\Omniconv\omniconv.exe --version
          dist\Omniconv\omniconv.exe doctor
      - name: Self-test the bundled GUI
        shell: pwsh
        env:
          QT_QPA_PLATFORM: offscreen
          OMNICONV_NO_MSGBOX: "1"
        # The windowed executable has no console and its event loop may return
        # at once under the offscreen platform, so process lifetime proves
        # nothing. --self-test builds the window and reports to a log file.
        run: |
          # The console binary first: its traceback is visible in the log.
          dist\Omniconv\omniconv.exe gui --self-test
          if ($LASTEXITCODE -ne 0) { throw "console GUI self-test exited with $LASTEXITCODE" }
          $log = "$env:LOCALAPPDATA\omniconv\self-test.log"
          Remove-Item $log -ErrorAction SilentlyContinue
          $p = Start-Process -FilePath dist\Omniconv\omniconvw.exe -ArgumentList '--self-test' -PassThru
          if (-not $p.WaitForExit(120000)) { Stop-Process -Id $p.Id -Force; throw "self-test did not finish within 120 s" }
          if (Test-Path $log) { Write-Host "--- self-test.log ---"; Get-Content $log } else { Write-Host "no self-test.log written" }
          if ($p.ExitCode -ne 0) { throw "bundled GUI self-test exited with $($p.ExitCode)" }
          if (-not (Select-String -Path $log -Pattern 'self-test ok' -Quiet)) { throw "self-test log does not report success" }
          Write-Host "bundled GUI self-test passed"
      - name: Upload Windows build
        uses: actions/upload-artifact@v4
        with:
          name: Omniconv-windows
          path: dist/Omniconv/
          if-no-files-found: error
      - name: Build the installer (Inno Setup)
        shell: pwsh
        run: |
          choco install innosetup -y --no-progress
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { $iscc = "$env:ProgramFiles\Inno Setup 6\ISCC.exe" }
          & $iscc packaging\windows\omniconv.iss
          if ($LASTEXITCODE -ne 0) { throw "ISCC failed with exit code $LASTEXITCODE" }
          if (-not (Test-Path dist\Omniconv-Setup.exe)) { throw "installer missing" }
          Get-Item dist\Omniconv-Setup.exe | Select-Object Name, Length
      - name: Upload Windows installer
        uses: actions/upload-artifact@v4
        with:
          name: Omniconv-windows-installer
          path: dist/Omniconv-Setup.exe
          if-no-files-found: error
      - name: Install, verify and uninstall silently
        shell: pwsh
        run: |
          $setup = Resolve-Path dist\Omniconv-Setup.exe
          $p = Start-Process -FilePath $setup -ArgumentList '/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART','/TASKS="addtopath,sendto"' -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "setup exited with $($p.ExitCode)" }
          # The installer defaults to a per-user install; accept either layout.
          $app = "$env:LOCALAPPDATA\Programs\Omniconv"
          if (-not (Test-Path "$app\omniconvw.exe")) { $app = "$env:ProgramFiles\Omniconv" }
          if (-not (Test-Path "$app\omniconvw.exe")) { throw "omniconvw.exe not installed under LocalAppData\Programs or Program Files" }
          if (-not (Test-Path "$app\omniconv.exe")) { throw "omniconv.exe not installed" }
          Write-Host "installed into $app"
          & "$app\omniconv.exe" --version
          if ($LASTEXITCODE -ne 0) { throw "installed CLI failed" }
          $menu = "$env:APPDATA\Microsoft\Windows\Start Menu\Programs\Omniconv\Omniconv.lnk"
          if (-not (Test-Path $menu)) { $menu = "$env:ProgramData\Microsoft\Windows\Start Menu\Programs\Omniconv\Omniconv.lnk" }
          if (-not (Test-Path $menu)) { throw "Start Menu shortcut missing" }
          $sendto = "$env:APPDATA\Microsoft\Windows\SendTo\Omniconv.lnk"
          if (-not (Test-Path $sendto)) { throw "Send to shortcut missing: $sendto" }
          $openwith = Get-ItemProperty "HKCU:\Software\Classes\Applications\omniconvw.exe\SupportedTypes" -ErrorAction Stop
          if (-not ($openwith.PSObject.Properties.Name -contains ".png")) { throw "Open with registration missing .png" }
          $userPath = (Get-ItemProperty HKCU:\Environment).Path
          if ($userPath -notlike "*Omniconv*") { throw "PATH entry missing; user PATH is: $userPath" }
          Write-Host "install verified: program, shortcuts, Open with, PATH"
          $unins = Get-ChildItem "$app\unins*.exe" | Select-Object -First 1
          $u = Start-Process -FilePath $unins.FullName -ArgumentList '/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART' -Wait -PassThru
          if ($u.ExitCode -ne 0) { throw "uninstall exited with $($u.ExitCode)" }
          Start-Sleep -Seconds 3
          if (Test-Path "$app\omniconvw.exe") { throw "omniconvw.exe still present after uninstall" }
          if (Test-Path "HKCU:\Software\Classes\Applications\omniconvw.exe") { throw "Open with registration not removed" }
          Write-Host "uninstall verified"
