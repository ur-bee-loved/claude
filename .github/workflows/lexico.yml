name: lexico

on:
  push:
    branches: [main]
    paths: ["lexico/**", ".github/workflows/lexico.yml"]
  pull_request:
    paths: ["lexico/**", ".github/workflows/lexico.yml"]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: lexico

jobs:
  test:
    name: Tests (Python ${{ matrix.python }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      matrix:
        python: ["3.9", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install the test tools
        run: python -m pip install pytest "ruff==0.16.10"
      - name: Lint
        run: python -m ruff check --isolated --line-length 120 lexico tests
      - name: Check fetch.sh
        run: sh -n fetch.sh
      - name: Tests
        run: python -m pytest -q tests
